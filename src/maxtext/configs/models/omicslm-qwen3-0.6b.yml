# OmicsLM built on top of Qwen3-0.6B (test/development config).

# Qwen3-0.6B backbone
base_emb_dim: 1024
base_num_query_heads: 16
base_num_kv_heads: 8
base_mlp_dim: 3072
base_num_decoder_layers: 28
head_dim: 128
mlp_activations: ["silu", "linear"]
vocab_size: 151936
decoder_block: "qwen3"
normalization_layer_epsilon: 1.0e-6
rope_max_timescale: 1000000
use_qk_norm: true
logits_via_embedding: true
normalize_embedding_logits: false
enable_dropout: false
tokenizer_type: "huggingface"

# OmicsLM settings
use_omics: true
omics_dim: 20006
omics_token_id: 151669
omics_projection_gain: 0.01

# Data pipeline
grain_file_type: "arrayrecord"
dataset_type: grain

# SFT settings
use_sft: true
sft_train_on_completion_only: true
packing: false
tokenize_train_data: true
train_data_columns: ['prompt', 'completion']

learning_rate: 1.e-4
warmup_steps_fraction: 0.05
